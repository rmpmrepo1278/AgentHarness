# Ruff config for agentharness
target-version = "py313"
line-length = 120

exclude = [
    "core/providers/_proxy_server_router_new_DEPRECATED.py",
    "merged-mcp",
    ".venv",
    "__pycache__",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
    "N802",   # function name should be lowercase (some existing names)
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "UP007",  # use X | Y for union types (keep Optional for now)
]

[lint.per-file-ignores]
"tests/*" = ["E501", "B011", "SIM108"]
"scripts/*" = ["E501", "F821"]

[format]
quote-style = "double"
indent-style = "space"
