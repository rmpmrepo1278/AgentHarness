services:
  mentedb:
    image: ghcr.io/nambok/mentedb:latest
    container_name: mentedb
    restart: always
    labels:
    - autoheal=true
    ports:
    - 127.0.0.1:6677:8080
    volumes:
    - mentedb-data:/data
    - /home/rohit/.hermes:/data/hermes:ro
    environment:
    - MENTEDB_DATA_DIR=/data
    - MENTEDB_LOG_LEVEL=info
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
          pids: 500
        reservations:
          memory: 128M
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - core_default
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo OK"]
      interval: 60s
      timeout: 10s
      retries: 3
    memswap_limit: 512M
    oom_score_adj: -250
networks:
  core_default:
    external: true
volumes:
  mentedb-data:
    driver: local
