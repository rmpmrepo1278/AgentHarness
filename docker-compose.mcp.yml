ervices:
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
    - AUTOHEAL_CONTAINER_LABEL=autoheal
    - AUTOHEAL_INTERVAL=120
    - AUTOHEAL_START_PERIOD=60
    - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    - CURL_TIMEOUT=30
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
          pids: 500
        reservations:
          memory: 64M
    oom_score_adj: -500
    memswap_limit: 128M
    read_only: true
    tmpfs:
    - /tmp
  backup-mcp:
    build: ./backup-mcp
    container_name: backup-mcp
    labels:
    - autoheal=true
    depends_on:
    - mcp-gateway
    deploy: &id001
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 500
        reservations:
          memory: 128M
    environment:
    - MCP_PORT=8102
    - GATEWAY_URL=http://127.0.0.1:8090
    - MCP_BASE_DIR=/mcp-base
    - DOCKER_HOST=tcp://172.17.0.1:2375
    network_mode: host
    restart: always
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - echo > /dev/tcp/127.0.0.1/8102
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
    - ./mcp-gateway/mcp_base.py:/mcp-base/mcp_base.py:ro
    - /mnt/usb/backups:/backups
    memswap_limit: 512M
    read_only: true
    tmpfs:
    - /tmp
  docker-mcp:
    build: ./docker-mcp
    container_name: docker-mcp
    labels:
    - autoheal=true
    depends_on:
    - mcp-gateway
    deploy: *id001
    environment:
    - MCP_PORT=8095
    - GATEWAY_URL=http://127.0.0.1:8090
    - MCP_BASE_DIR=/mcp-base
    - DOCKER_HOST=tcp://172.17.0.1:2375
    network_mode: host
    restart: always
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - echo > /dev/tcp/127.0.0.1/8095
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
    - ./templates/docker:/templates/repo:ro
    - ~/mcp-gateway/templates:/templates/local
    - ~/mcp-gateway/secrets:/secrets
    - ./mcp-gateway/mcp_base.py:/mcp-base/mcp_base.py:ro
    - mcp-stacks:/data/stacks
    memswap_limit: 512M
    read_only: true
    tmpfs:
    - /tmp
