name: hermes-gateway-down
version: 1
trigger: "health_check_fail:hermes_gateway"
priority: critical
notify: critical
description: >
  Recover the Hermes gateway service (hermes-gateway.service).
  Since Hermes IS the notification system, this runbook sends
  alerts directly via Telegram API on failure.

steps:
  - name: check-gateway-state
    check: "systemctl --user is-active hermes-gateway"
    expect_contains: "active"
    on_fail:
      - name: restart-gateway
        fix: "systemctl --user restart hermes-gateway"
        wait: 15
      - name: verify-gateway-running
        check: "systemctl --user is-active hermes-gateway"
        expect_contains: "active"
        on_fail:
          - name: read-gateway-logs
            check: "journalctl --user -u hermes-gateway --no-pager -n 50"
            interpret: llm
            on_unknown:
              escalate: true

  - name: notify-telegram-direct
    check: "systemctl --user is-active hermes-gateway"
    expect_contains: "active"
    on_fail:
      - fix: >
          curl -sf -X POST
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          -d chat_id="${TELEGRAM_CHAT_ID}"
          -d parse_mode=Markdown
          -d text="*AgentHarness Doctor*: Hermes gateway is DOWN and could not be auto-recovered. Manual intervention required."
        wait: 2
      - escalate: "Hermes gateway is down and could not be restarted. Direct Telegram alert sent."
